name: vendor-portal

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vendor_portal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-vendor_portal}
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      # Exposed on the host for local tools (psql, DBeaver). Remove in production.
      - "${POSTGRES_HOST_PORT:-5434}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build: .
    image: vendor-portal-api:latest
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-vendor_portal}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-vendor_portal}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:8080}
      DEFAULT_VENDOR_ID: ${DEFAULT_VENDOR_ID:-}
    volumes:
      - uploads:/data/uploads
    ports:
      - "${API_HOST_PORT:-8000}:8000"
    restart: unless-stopped

volumes:
  db-data:
  uploads:
